name: Build and deploy to crates.io
on:
  push:
    branches: [main]
    paths:
    - '.github/workflows/publish.yml'
    - 'Cargo.toml'
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
    - run: cargo publish --workspace
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
