[package]
name = "android-manifest-derive"
version = "0.4.0"
description = "Internal XML derive macros for android-manifest"
repository = "https://github.com/dodorare/android-manifest-rs"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.85"

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_tokenstream = "0.2"
syn = { version = "2.0", features = ["extra-traits", "parsing", "visit"] }
